name: secret-scan

# Gitleaks over the full git history on every push and PR. Fails if any secret is found.
# Public-by-design client keys (Supabase anon/publishable, PostHog phc_) are allowlisted
# narrowly in .github/gitleaks.toml. Anything else fails.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so a secret added then removed is still caught

      - name: Install gitleaks v8.30.1 (checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan
        run: gitleaks git --redact --verbose --config .github/gitleaks.toml .
